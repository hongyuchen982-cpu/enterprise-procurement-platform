[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["alembic/versions", "pytest-cache-files-*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q -p no:cacheprovider"
asyncio_default_fixture_loop_scope = "function"
